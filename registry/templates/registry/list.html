{% extends "registry/base.html" %}
{% block content %}
<h1>Beneficiaries</h1>
<form method="get">
  <input name="q" value="{{ q }}" placeholder="Search name, ID or phone">
  <select name="status"><option value="">All statuses</option>
    {% for value, label in statuses %}<option value="{{ value }}" {% if value == status %}selected{% endif %}>{{ label }}</option>{% endfor %}
  </select>
  <button>Filter</button>
</form>
<table>
<tr><th>ID</th><th>Name</th><th>District</th><th>Household</th><th>Status</th><th></th></tr>
{% for b in items %}
<tr><td>{{ b.national_id }}</td><td>{{ b.full_name }}</td><td>{{ b.district }}</td><td>{{ b.household_size }}</td><td>{{ b.get_status_display }}</td>
<td><a href="{% url 'registry:edit' b.pk %}">Edit</a></td></tr>
{% empty %}<tr><td colspan="6">No records found.</td></tr>{% endfor %}
</table>
{% endblock %}
